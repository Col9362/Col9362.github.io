# Skills page data. Each item uses `img` (a logo file in static/images/skills/),
# `icon` (a one-color SVG in assets/icons/, from simpleicons.org, tinted with `color`)
# or `fa` (a Font Awesome class, tinted with `color`).
groups:
  - name: Programming
    items:
      - { name: Python, img: python.svg }
      - { name: MicroPython, icon: micropython }
      - { name: C++, img: cplusplus.svg }
      - { name: Java, img: java.svg }

  - name: Electronics & PCB Design
    items:
      - { name: KiCad, img: kicad.svg }
      - { name: Circuit Design, fa: "fa-solid fa-microchip", color: "#2BB673" }
      - { name: Circuit Analysis, fa: "fa-solid fa-wave-square", color: "#E3A008" }
      - { name: Logic Design, fa: "fa-solid fa-diagram-project", color: "#8B5CF6" }
      - { name: Soldering, fa: "fa-solid fa-fire-flame-curved", color: "#F05032" }

  - name: Microcontrollers
    items:
      - { name: Raspberry Pi, img: raspberrypi.svg }
      - { name: ESP32, icon: espressif, color: "#E7352C" }
      - { name: Arduino, img: arduino.svg }

  - name: CAD & Fabrication
    items:
      - { name: Onshape, img: onshape.png }
      - { name: 3D Printing, fa: "fa-solid fa-print", color: "#F97316" }
      - { name: CNC Mill & Lathe, fa: "fa-solid fa-gears", color: "#64748B" }
      - { name: Machining & Hand Tools, fa: "fa-solid fa-screwdriver-wrench", color: "#94A3B8" }

  - name: Software & Tools
    items:
      - { name: Git, img: git.svg }
