  - name: Productivity
    items:
      - { name: Word, img: word.svg }
      - { name: Excel, img: excel.svg }
      - { name: PowerPoint, img: powerpoint.svg }
      - { name: Google Sheets, img: googlesheets.svg }
      - { name: Shopify, icon: shopify, color: "#7AB55C" }
