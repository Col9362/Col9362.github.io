# ============================================================
#  SITE SETTINGS: edit the values in this section first
# ============================================================
baseURL = "https://colezuckerman.com/"
title = "Cole Zuckerman"
theme = "hugo-coder"
locale = "en"
enableEmoji = true

[params]
author = "Cole Zuckerman"
description = "Cole Zuckerman: electrical engineering student at Purdue building PCBs, embedded systems and hardware projects."
keywords = "Cole Zuckerman,electrical engineering,Purdue,PCB design,embedded systems,portfolio"
# Lines shown under your name on the home page
info = ["Electrical Engineering @ Purdue", "PCB Design · Embedded Systems · CAD"]
# Your headshot. Put the file in static/images/ and update this path
avatarURL = "images/avatar.jpg"
dateFormat = "January 2006"
since = 2026
# "auto" follows the visitor's system setting; "light" or "dark" forces one
colorScheme = "auto"
hideColorSchemeToggle = false
customCSS = ["css/custom.css"]

# Social icons on the home page. Delete any you don't use.
# Icon names come from https://fontawesome.com/icons (free brands/solid)
[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/Col9362/"

[[params.social]]
name = "LinkedIn"
icon = "fa-brands fa-linkedin fa-2x"
weight = 2
url = "https://www.linkedin.com/in/colezuckerman/"

[[params.social]]
name = "Email"
icon = "fa-solid fa-envelope fa-2x"
weight = 3
url = "mailto:colezuckerman2@gmail.com"

# Top navigation menu
[[menu.main]]
name = "About"
weight = 1
url = "about/"

[[menu.main]]
name = "Projects"
weight = 2
url = "projects/"

[[menu.main]]
name = "Contact"
weight = 3
url = "contact/"

